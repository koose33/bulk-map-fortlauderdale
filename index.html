<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Broward Bulk Trash</title>
<meta name="description" content="Find your bulk trash pickup zone and next pickup date anywhere in Broward County.">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23FF2E93' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M2.2 9.2h19.6'/%3E%3Cpath d='M3.6 9.2l1.2-2.6h15.8l.9 2.6'/%3E%3Cpath d='M3 9.2h18.4V18H6.6z'/%3E%3Crect x='9' y='11.3' width='10' height='2.4' rx='.6'/%3E%3Ccircle cx='9' cy='20.1' r='1.1'/%3E%3Ccircle cx='18.6' cy='20.1' r='1.1'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Roboto+Condensed:wght@400;500;600;700&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --ink: #0f172a;
    --ink-2: #334155;
    --muted: #64748b;
    --line: #e2e8f0;
    --accent: #0A84FF;
    --you: #0A84FF;
    --shadow: 0 10px 30px rgba(15, 23, 42, .14), 0 2px 6px rgba(15, 23, 42, .06);
    --radius: 16px;
    --display: 'Oswald', 'Arial Narrow', sans-serif;
    --body: 'Roboto', system-ui, -apple-system, sans-serif;
    --cond: 'Roboto Condensed', 'Arial Narrow', sans-serif;   /* small labels, subtitles, fine print */
    /* South Florida neon rainbow */
    --neon: linear-gradient(90deg, #FF2E93, #FF1F3D, #FF7A00, #FFD500, #8CF21A, #00E0C6, #0A84FF, #4B3BFF, #A63DFF, #F01FE0);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    font-family: var(--body);
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }

  /* ---------- Top bar ---------- */
  .topbar {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px 12px;
    padding-top: max(10px, env(safe-area-inset-top));
    background: var(--surface);
    z-index: 1000;
    flex-shrink: 0;
  }
  .topbar::after {                           /* thin neon rainbow stripe under the header */
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--neon);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .brand-mark { width: 34px; height: 34px; flex-shrink: 0; color: var(--ink); }
  .brand h1 {
    font-family: var(--display); font-weight: 600; font-size: 21px; line-height: 1.05;
    letter-spacing: .02em; text-transform: uppercase; white-space: nowrap;
  }
  .brand p { font: 400 13px var(--cond); letter-spacing: .01em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .brand-text { min-width: 0; }
  .home-btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    font: 500 14px var(--body); padding: 8px 12px; border-radius: 10px; cursor: pointer; white-space: nowrap;
  }
  .home-btn svg { width: 17px; height: 17px; }
  .home-btn:hover { background: var(--bg); }
  .city-select {
    font: 500 14px var(--body); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface);
    max-width: 210px; cursor: pointer;
  }

  /* ---------- Map ---------- */
  #stage { position: relative; flex: 1; min-height: 0; }
  #map { position: absolute; inset: 0; background: #eef2f7; }
  .leaflet-container { font-family: var(--body); }
  .leaflet-interactive { transition: fill-opacity .15s ease, fill .15s ease; }

  .city-label {
    background: transparent; border: 0; box-shadow: none; padding: 1px 6px; border-radius: 999px;
    font: 600 12px var(--display); letter-spacing: .04em; text-transform: uppercase; color: #0f172a;
    text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 6px #fff, 0 0 8px #fff;
    transition: opacity .15s ease;
    pointer-events: none; white-space: nowrap;
  }
  .city-label::before { display: none; }
  .city-label.is-crowded { visibility: hidden; }        /* no room right now - comes back as you zoom in */
  .city-label.is-dim { opacity: .4 !important; }
  .city-label.is-hover {                                 /* hovered city: its name always shows, on a white pill */
    visibility: visible; opacity: 1 !important; font-size: 15px; font-weight: 700;
    background: rgba(255,255,255,.96); box-shadow: 0 2px 8px rgba(15,23,42,.25); text-shadow: none;
  }
  .zone-label {
    background: rgba(255,255,255,.96); border: 0; border-radius: 999px; padding: 3px 8px;
    box-shadow: 0 1px 4px rgba(15,23,42,.25); font: 700 12px var(--cond); color: #0f172a;
    white-space: nowrap; pointer-events: none;
  }
  .zone-label::before { display: none; }
  .zone-label.is-hidden { visibility: hidden; }
  .zone-tip { border: 0; border-radius: 12px; padding: 10px 12px; box-shadow: 0 8px 24px rgba(15,23,42,.18); font-family: var(--body); }
  .zone-tip b { display: block; font: 600 15px var(--display); letter-spacing: .02em; margin-bottom: 2px; }
  .zone-tip .s { color: #334155; font: 400 13px var(--cond); }
  .zone-tip .n { margin-top: 6px; font-size: 12.5px; font-weight: 700; }
  .zone-tip .h { margin-top: 4px; font-size: 11px; color: #64748b; }

  /* "You are here" dot */
  .you-dot { position: relative; width: 20px; height: 20px; }
  .you-dot i {
    position: absolute; inset: 2px; border-radius: 50%; background: var(--you);
    border: 3px solid #fff; box-shadow: 0 1px 6px rgba(15,23,42,.45);
  }
  .you-dot::before {
    content: ""; position: absolute; inset: -10px; border-radius: 50%; background: var(--you); opacity: .35;
    animation: pulse 1.8s ease-out infinite;
  }
  @keyframes pulse { from { transform: scale(.4); opacity: .55; } to { transform: scale(1.4); opacity: 0; } }

  /* ---------- Locate button (bottom-right corner, under the zoom buttons) ---------- */
  .locate-btn {
    display: flex; align-items: center; gap: 8px;
    background: var(--ink); color: #fff; border: 0; border-radius: 999px;
    padding: 11px 16px 11px 13px; font: 600 15px var(--display); letter-spacing: .04em; text-transform: uppercase;
    box-shadow: var(--shadow); cursor: pointer;
  }
  .locate-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
  .locate-btn:hover { background: #1e293b; }
  .locate-btn.is-busy svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .leaflet-bottom.leaflet-right .leaflet-control { margin-right: 12px; }
  .leaflet-control-zoom { margin-left: auto !important; }

  /* ---------- Hint ---------- */
  .hint {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    background: rgba(15, 23, 42, .88); color: #fff; font: 500 14px var(--cond); letter-spacing: .01em;
    padding: 9px 14px; border-radius: 999px; z-index: 900; pointer-events: none; white-space: nowrap;
  }

  /* ---------- Zone legend ---------- */
  .legend {
    position: absolute; left: 12px; bottom: 12px; z-index: 900;
    width: 260px; max-height: 45vh; display: flex; flex-direction: column;
    background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden;
  }
  .legend-head {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 10px 12px; cursor: pointer; border: 0; background: none;
    color: var(--ink); text-align: left; width: 100%;
  }
  .legend-head span:first-child { font: 600 15px var(--display); letter-spacing: .05em; text-transform: uppercase; }
  .legend-head span:last-child { color: var(--muted); font-size: 13px; }
  .legend ul { list-style: none; overflow-y: auto; border-top: 1px solid var(--line); }
  .legend.collapsed ul { display: none; }
  .legend li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer; font-size: 13px; }
  .legend li:hover, .legend li.active { background: #f1f5f9; }
  .swatch { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; }
  .legend li small { display: block; color: var(--muted); font: 400 12px var(--cond); }

  /* ---------- Detail panel ---------- */
  .panel {
    position: absolute; top: 12px; right: 12px; z-index: 950;
    width: 360px; max-height: calc(100% - 24px); overflow-y: auto;
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 18px;
  }
  .panel-close {
    position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 50%;
    border: 0; background: #f1f5f9; font-size: 18px; line-height: 32px; cursor: pointer; color: var(--ink-2);
  }
  .eyebrow { font: 700 13px var(--cond); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .zone-title {
    display: flex; align-items: center; gap: 10px; margin: 6px 40px 4px 0;
    font: 600 24px/1.15 var(--display); letter-spacing: .01em;
  }
  .zone-title .swatch { width: 18px; height: 18px; border-radius: 6px; }
  .you-chip {
    display: inline-flex; align-items: center; gap: 6px; margin: 2px 0 8px;
    background: #e0efff; color: #0657b5; font: 700 13px var(--cond); padding: 4px 9px; border-radius: 999px;
  }
  .you-chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--you); }
  .schedule { color: var(--ink-2); font-size: 14px; margin-bottom: 14px; }
  .next-card { border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; }
  .next-card .label { font: 700 13px var(--cond); opacity: .85; text-transform: uppercase; letter-spacing: .08em; }
  .next-card .date { font: 600 28px/1.1 var(--display); margin-top: 3px; }
  .next-card .when { font-size: 13px; opacity: .9; margin-top: 3px; font-weight: 500; }
  .upcoming { margin-bottom: 14px; }
  .upcoming h3 { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .upcoming ul { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .upcoming li { font: 400 14px var(--cond); background: #f8fafc; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .actions { display: grid; gap: 8px; margin-bottom: 12px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font: 500 14px var(--body); padding: 12px 14px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none;
  }
  .btn svg { width: 17px; height: 17px; flex-shrink: 0; }
  .btn:hover { background: #f8fafc; }
  .btn-primary { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 700; }
  .btn-primary:hover { background: #1e293b; }
  .btn-you { background: var(--you); color: #fff; border-color: var(--you); font-weight: 700; }
  .btn-you:hover { background: #0670dd; }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn-row > :only-child { grid-column: 1 / -1; }   /* a lone button fills the row */
  .note { font-size: 12.5px; color: var(--ink-2); background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
  .fineprint { font: 400 12px/1.5 var(--cond); color: var(--muted); }
  .fineprint a, .note a { color: var(--accent); }

  /* ---------- Mobile ---------- */
  @media (max-width: 700px) {
    .brand p { display: none; }
    .brand h1 { font-size: 18px; }
    .brand-mark { width: 30px; height: 30px; }
    .city-select { max-width: 130px; font-size: 13px; }
    .home-btn { padding: 8px 10px; }
    body.away .brand-text { display: none; }
    .panel {
      top: auto; right: 0; left: 0; bottom: 0; width: 100%;
      max-height: 64%; border-radius: 20px 20px 0 0;
      padding-bottom: max(18px, env(safe-area-inset-bottom));
    }
    .panel::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 4px; background: #cbd5e1; margin: -6px auto 12px; }
    .legend { left: 8px; bottom: 8px; width: calc(100% - 84px); max-height: 38vh; }
    .locate-btn span { display: none; }
    .locate-btn { padding: 13px; }
    .hint { font-size: 12px; }
    body.panel-open .leaflet-bottom.leaflet-right { display: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <button id="homeBtn" class="home-btn" type="button" hidden aria-label="Back to home screen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9v11h14V9"/><path d="M10 20v-6h4v6"/></svg>
    Home
  </button>
  <div class="brand">
    <!-- Approved icon "D": front-load dumpster, side view, line style -->
    <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2.2 9.2h19.6"/><path d="M3.6 9.2l1.2-2.6h15.8l.9 2.6"/><path d="M3 9.2h18.4V18H6.6z"/>
      <rect x="9" y="11.3" width="10" height="2.4" rx=".6"/><circle cx="9" cy="20.1" r="1.1"/><circle cx="18.6" cy="20.1" r="1.1"/>
    </svg>
    <div class="brand-text">
      <h1>Broward Bulk Trash</h1>
      <p id="subtitle">Tap a city to see its bulk pickup zones</p>
    </div>
  </div>
  <select id="citySelect" class="city-select" aria-label="Choose a city">
    <option value="">Choose a city…</option>
  </select>
</header>

<div id="stage">
<div id="map" role="application" aria-label="Map of Broward County bulk trash zones"></div>
<div id="hint" class="hint">Tap a city to zoom in</div>

<section id="legend" class="legend collapsed" hidden>
  <button id="legendHead" class="legend-head" type="button"><span>Zones</span><span id="legendCount"></span></button>
  <ul id="legendList"></ul>
</section>

<aside id="panel" class="panel" hidden aria-live="polite">
  <button id="panelClose" class="panel-close" aria-label="Close">&times;</button>
  <div id="panelBody"></div>
</aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* =====================================================================
   Broward Bulk Trash – interactive bulk pickup map
   - Home (overview): every Broward city in the neon rainbow, north (pink)
     to south (magenta). Hover = darker shade + bigger name. Tap = zoom in.
   - City view: chosen city bright, neighbors dulled, zones in rainbow
     order along the city's longer side. Tap a zone = next date, calendar,
     directions.
   - "Find me": shows your dot, which city + zone you're in, and your next
     pickup, with a button to zoom into your zone.
   - Anything that isn't the home screen shows a Home button.
   ===================================================================== */

// ---------- 1. Data: which file holds each city's zones ----------
// Keys match CITYNAME in Broward-Cities.geojson (county outlines).
const CITIES = {
  'FORT LAUDERDALE': { file: 'Bulk-Map-FortLauderdale.geojson' },
  'WILTON MANORS':   { file: 'Bulk-Map-WiltonManors.geojson' },
  'OAKLAND PARK':    { file: 'Bulk-Map-OaklandPark.geojson',
                       note: 'No pickup in weeks that start on a 5th Monday. Items out by 7 a.m. Monday of your week.' },
  'POMPANO BEACH':   { file: 'Bulk-Map-PompanoBeach.geojson' },
  'SUNRISE':         { file: 'Bulk-Map-Sunrise.geojson' },
  'DAVIE':           { file: 'Bulk-Map-Davie.geojson',
                       note: 'Part of northeast Davie has no zone in the town’s data. If your home isn’t colored, call the Town of Davie.' },
  'MIRAMAR':         { file: 'Bulk-Map-Miramar.geojson' },
  'PEMBROKE PINES':  { file: 'Bulk-Map-PembrokePines.geojson' },
  'DEERFIELD BEACH': { file: 'Bulk-Map-DeerfieldBeach.geojson' },
  'LAUDERHILL':      { file: 'Bulk-Map-Lauderhill.geojson',
                       note: 'Lauderhill has not published its 2026 bulk dates online yet. Call the city to confirm your date.' },
  'MARGATE':         { file: 'Bulk-Map-Margate.geojson' },
  'TAMARAC':         { file: 'Bulk-Map-Tamarac.geojson' },
  'WESTON':          { file: 'Bulk-Map-Weston.geojson' },
  'CORAL SPRINGS':   { file: 'Bulk-Map-CoralSprings.geojson' },

  // Cities with no public zone map yet – shown with guidance only.
  'COCONUT CREEK':   { info: 'Single-family bulk is picked up on your first garbage day of the week. Coconut Creek doesn’t publish a zone map.',
                       link: { label: 'Look up your day (Republic Services)', url: 'https://www.republicservices.com/schedule' } },
  'PARKLAND':        { info: 'Bulk is picked up monthly, on a day set by your neighborhood. Parkland lists neighborhoods by name instead of a map.',
                       link: { label: 'Parkland 2026 bulk schedule (PDF)', url: 'https://www.cityofparkland.org/DocumentCenter/View/23886/Parkland-2026-Bulk-Schedule---FINAL' } },
  'PLANTATION':      { info: 'Bulk is picked up monthly, on a day set by your area (east or west of University Drive). The city only publishes PDF maps.' },
  'HOLLYWOOD':       { info: 'Hollywood doesn’t publish a bulk zone map online. Contact the city to confirm your bulk day.' },
  'LAUDERDALE LAKES':{ info: 'Lauderdale Lakes doesn’t publish a bulk zone map online. Contact the city to confirm your bulk day.' },
  'NORTH LAUDERDALE':{ info: 'North Lauderdale doesn’t publish a bulk zone map online. Contact the city to confirm your bulk day.' },
};
const NOT_A_CITY = ['BMSD', 'TRIBAL LAND'];    // unincorporated areas in the county file

// ---------- 2. Colors ----------
const PALETTE = [
  ['Hot pink','#FF2E93'],['Neon red','#FF1F3D'],['Orange','#FF7A00'],['Yellow','#FFD500'],['Lime','#8CF21A'],
  ['Aqua','#00E0C6'],['Electric blue','#0A84FF'],['Indigo','#4B3BFF'],['Violet','#A63DFF'],['Magenta','#F01FE0']];
const P = PALETTE.length;
const ring = (a,b) => { const d = Math.abs(a-b); return Math.min(d, P-d); };

function rings(g){ return g.type==='Polygon' ? [g.coordinates] : g.type==='MultiPolygon' ? g.coordinates : []; }
function geomInfo(g){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9, sx=0, sy=0, a=0;
  for (const poly of rings(g)) { const r=poly[0];
    for (let i=0,j=r.length-1;i<r.length;j=i++){ const [xi,yi]=r[i],[xj,yj]=r[j]; const c=xj*yi-xi*yj; a+=c; sx+=(xi+xj)*c; sy+=(yi+yj)*c;
      if(xi<x0)x0=xi; if(xi>x1)x1=xi; if(yi<y0)y0=yi; if(yi>y1)y1=yi; } }
  const cx = a ? sx/(3*a) : (x0+x1)/2, cy = a ? sy/(3*a) : (y0+y1)/2;
  return { bbox:[x0,y0,x1,y1], cx, cy };
}
// Neighbors = shapes whose outlines pass through the same small grid cell.
function neighbors(feats, cell){
  const owner = new Map(), adj = feats.map(()=>new Set());
  feats.forEach((f,k)=>{ const seen=new Set();
    for (const poly of rings(f.geometry)) for (const r of poly)
      for (let i=1;i<r.length;i++){ const [ax,ay]=r[i-1],[bx,by]=r[i];
        const steps=Math.max(1,Math.ceil(Math.hypot(bx-ax,by-ay)/(cell/2)));
        for(let s=0;s<=steps;s++){ const x=ax+(bx-ax)*s/steps, y=ay+(by-ay)*s/steps;
          const key=Math.floor(x/cell)+','+Math.floor(y/cell); if(seen.has(key))continue; seen.add(key);
          const o=owner.get(key); if(!o) owner.set(key,[k]); else { for(const j of o){adj[j].add(k);adj[k].add(j);} o.push(k);} } } });
  return adj;
}
// axis: 'auto' picks the longer side of the whole set; 'ns' forces north->south.
function rainbowColors(feats, axis='auto'){
  const info = feats.map(f=>geomInfo(f.geometry));
  let X0=1e9,Y0=1e9,X1=-1e9,Y1=-1e9; info.forEach(({bbox:[a,b,c,d]})=>{X0=Math.min(X0,a);Y0=Math.min(Y0,b);X1=Math.max(X1,c);Y1=Math.max(Y1,d);});
  const midLat=(Y0+Y1)/2, wide=(X1-X0)*Math.cos(midLat*Math.PI/180) > (Y1-Y0);
  const dir = axis==='ns' ? 'ns' : (wide ? 'we' : 'ns');
  const span = Math.max(X1-X0, Y1-Y0);
  const cell = Math.max(0.0003, Math.min(0.002, span/250));
  const adj = neighbors(feats, cell);
  const order = feats.map((_,i)=>i).sort((a,b)=> dir==='ns' ? info[b].cy-info[a].cy : info[a].cx-info[b].cx);
  const n = feats.length, ideal = new Array(n), idx = new Array(n).fill(0);
  order.forEach((k,rank)=>{ ideal[k] = n===1 ? 0 : rank*(P-1)/(n-1); idx[k] = Math.round(ideal[k]); });
  // Cost: same color next door is worst, next-door hue (e.g. pink beside red) is bad,
  // and drifting away from the rainbow position costs a little.
  const nodeCost = (k,c) => { let x = (c-ideal[k])**2; for (const j of adj[k]) { const g = ring(c, idx[j]); if (g===0) x += 10000; else if (g===1) x += 1000; } return x; };
  const total = () => idx.reduce((t,c,k)=>t+nodeCost(k,c),0);
  let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const settle = () => { for (let sweep=0; sweep<100; sweep++) { let moved=false;
      for (const k of order) { let best=idx[k], bc=nodeCost(k,best);
        for (let c=0;c<P;c++){ const v=nodeCost(k,c); if (v<bc-1e-9){bc=v;best=c;} }
        if (best!==idx[k]) { idx[k]=best; moved=true; } }
      if (!moved) break; } };
  settle(); let bestIdx=[...idx], bestCost=total();
  for (let round=0; round<60 && bestCost>=1000; round++) {        // shake up any leftover clashes and retry
    idx.splice(0, n, ...bestIdx);
    for (let k=0;k<n;k++) if ([...adj[k]].some(j=>ring(idx[k],idx[j])<2) || rnd()<0.1) idx[k]=Math.floor(rnd()*P);
    settle(); const t=total(); if (t<bestCost){bestCost=t; bestIdx=[...idx];}
  }
  idx.splice(0, n, ...bestIdx);
  return { idx, adj, dir, order };
}
const COLORS = PALETTE.map(p => p[1]);
const DULL = { fillColor: '#cbd5e1', fillOpacity: 0.28, color: '#94a3b8', weight: 1 };

// ---------- 3. Small helpers ----------
const $ = id => document.getElementById(id);
const titleCase = s => s.toLowerCase().replace(/\b\w/g, c => c.toUpperCase()).replace(/\bBy\b/g, 'by').replace(/\bThe\b/g, 'the');
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');

function shade(hex, amt) {                 // amt < 0 darker, > 0 lighter
  let [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return '#' + [f(r), f(g), f(b)].map(v => v.toString(16).padStart(2, '0')).join('');
}
// Dark text on bright colors (yellow, lime, aqua…), white text on deep ones.
function textOn(hex) {
  const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)
    .map(v => v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.32 ? '#0f172a' : '#ffffff';
}

// Rough area of a shape (degrees²) - bigger cities/zones claim label space first.
function ringArea(r) { let a = 0; for (let i = 0, j = r.length - 1; i < r.length; j = i++) a += (r[j][0] + r[i][0]) * (r[j][1] - r[i][1]); return Math.abs(a / 2); }
function geoArea(g) { return rings(g).reduce((t, p) => t + ringArea(p[0]) - p.slice(1).reduce((h, r) => h + ringArea(r), 0), 0); }
// Do two on-screen boxes touch (with a little breathing room)?
const overlaps = (r, q, pad = 3) => r.left - pad < q.right && r.right + pad > q.left && r.top - pad < q.bottom && r.bottom + pad > q.top;

// Is a [lng, lat] point inside a GeoJSON Polygon / MultiPolygon (holes respected)?
function pointInGeom(pt, g) {
  const inRing = (r) => { let c = false; for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
    const [xi, yi] = r[i], [xj, yj] = r[j];
    if ((yi > pt[1]) !== (yj > pt[1]) && pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) c = !c; } return c; };
  return rings(g).some(poly => inRing(poly[0]) && !poly.slice(1).some(inRing));
}

// ---------- 4. Dates ----------
const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fmtLong = d => d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
const fmtShort = d => d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

function nthWeekday(y, m, weekday, n) {   // m = 0-11
  const first = new Date(y, m, 1);
  const offset = (DAYS.indexOf(weekday) - first.getDay() + 7) % 7;
  const d = new Date(y, m, 1 + offset + (n - 1) * 7);
  return d.getMonth() === m ? d : null;
}

// Dates come from the city's published list first, then the repeat rule
// keeps them going (so the map never "runs out" at the end of the year).
function upcomingDates(p, count = 12) {
  const start = today();
  let dates = (p.bulk_dates || []).map(parseISO).filter(d => d >= start);
  const r = p.rule;
  if (r && dates.length < count) {
    let from = dates.length ? new Date(dates[dates.length - 1].getTime() + 86400000) : start;
    const lastListed = (p.bulk_dates || []).map(parseISO).pop();
    if (lastListed && lastListed >= from) from = new Date(lastListed.getTime() + 86400000);
    if (r.type === 'weekly') {
      const d = new Date(from);
      while (d.getDay() !== DAYS.indexOf(r.weekday)) d.setDate(d.getDate() + 1);
      while (dates.length < count) { dates.push(new Date(d)); d.setDate(d.getDate() + 7); }
    } else if (r.type === 'nth') {
      let y = from.getFullYear(), m = from.getMonth();
      for (let i = 0; i < 48 && dates.length < count; i++) {
        if (r.months.includes(m + 1)) {
          r.n.map(n => nthWeekday(y, m, r.weekday, n)).filter(Boolean)
            .map(d => { d.setDate(d.getDate() + (r.offset || 0)); return d; })
            .filter(d => d >= from).sort((a, b) => a - b)
            .forEach(d => { if (dates.length < count) dates.push(d); });
        }
        if (++m > 11) { m = 0; y++; }
      }
    }
  }
  return dates.slice(0, count);
}

function daysAway(d) {
  const n = Math.round((d - today()) / 86400000);
  return n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : `In ${n} days`;
}

// ---------- 5. Calendar + directions ----------
function downloadICS(city, zone, dates, schedule) {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  const esc = s => String(s).replace(/[,;\\]/g, m => '\\' + m);
  const events = dates.map(d => {
    const a = iso(d).replace(/-/g, '');
    const nx = new Date(d); nx.setDate(nx.getDate() + 1);
    return [
      'BEGIN:VEVENT',
      `UID:${a}-${slug(city)}-${slug(zone)}@browardbulktrash`,
      `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${a}`,
      `DTEND;VALUE=DATE:${iso(nx).replace(/-/g, '')}`,
      `SUMMARY:${esc(`Bulk trash pickup – ${city}`)}`,
      `DESCRIPTION:${esc(`${zone}. ${schedule}. Put bulk items at the curb the night before.`)}`,
      'BEGIN:VALARM', 'TRIGGER:-PT5H', 'ACTION:DISPLAY', 'DESCRIPTION:Bulk pickup tomorrow – put items out tonight', 'END:VALARM',
      'END:VEVENT'
    ].join('\r\n');
  });
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Broward Bulk Trash//EN', 'CALSCALE:GREGORIAN', ...events, 'END:VCALENDAR'].join('\r\n');
  const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = `bulk-pickup-${slug(city)}-${slug(zone)}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function googleCalLink(city, zone, d, schedule) {
  const a = iso(d).replace(/-/g, '');
  const nx = new Date(d); nx.setDate(nx.getDate() + 1);
  const q = new URLSearchParams({
    action: 'TEMPLATE', text: `Bulk trash pickup – ${city}`,
    dates: `${a}/${iso(nx).replace(/-/g, '')}`,
    details: `${zone}. ${schedule}. Put bulk items at the curb the night before.`
  });
  return `https://calendar.google.com/calendar/render?${q}`;
}
const directionsLink = ll => `https://www.google.com/maps/dir/?api=1&destination=${ll.lat.toFixed(6)},${ll.lng.toFixed(6)}`;

const map = L.map('map', { zoomControl: false, maxZoom: 18 }).setView([26.15, -80.25], 10);
// Background map: Esri Light Gray Canvas (free, no API key). Street/place names

const state = {
  city: null, cityLayers: {}, cityFeatures: {}, zonesLayer: null, zoneItems: [], activeZone: null,
  browardBounds: null, zoneCache: {}, you: null, away: false
};

// ---------- 7. Home screen (all of Broward) ----------
function overviewStyle(l) {
  return { fillColor: l._color, fillOpacity: 0.62, color: '#ffffff', weight: 1.5 };
}

// Fit all of Broward. If the map box has no size yet (page still laying out),
// wait and do it once it does - otherwise Leaflet zooms to street level.
function fitBroward() {
  map.invalidateSize();
  const s = map.getSize();
  if (!s.x || !s.y) { state.needsFit = true; return; }
  state.needsFit = false;
  map.fitBounds(state.browardBounds, { padding: [10, 10] });
}
new ResizeObserver(() => {
  map.invalidateSize();
  if (state.needsFit && state.browardBounds && !state.city) fitBroward();
}).observe(document.getElementById('map'));

// Show the Home button whenever we're not on the home screen.
function setAway(on) {
  state.away = on;
  $('homeBtn').hidden = !on;
  document.body.classList.toggle('away', on);
}

fetch('Broward-Cities.geojson').then(r => r.json()).then(data => {
  data.features = data.features.filter(f => f.geometry);
  const layer = L.geoJSON(data, {
    onEachFeature: (f, l) => {
      const key = f.properties.CITYNAME;
      l._key = key;
      l._area = geoArea(f.geometry);
      state.cityLayers[key] = l;
      state.cityFeatures[key] = f;
      // The name sits at the deepest point inside the city's own shape, not the middle of its outline box.
      l._label = L.marker(labelPoint(f.geometry), { interactive: false, keyboard: false, icon: L.divIcon({ className: '', iconSize: [0, 0] }) })
        .bindTooltip(NOT_A_CITY.includes(key) ? 'Unincorporated' : titleCase(key), { permanent: true, direction: 'center', opacity: 1, className: 'city-label' });
      l.on('mouseover', () => hoverCity(l, true));
      l.on('mouseout', () => hoverCity(l, false));
      l.on('click', e => { L.DomEvent.stopPropagation(e); if (state.city !== key) openCity(key); });
    }
  }).addTo(map);

  // Rainbow from north (hot pink) to south (magenta); neighbors never match or sit next to each other on the rainbow.
  const keys = data.features.map(f => f.properties.CITYNAME);
  rainbowColors(data.features, 'ns').idx.forEach((c, i) => { state.cityLayers[keys[i]]._color = COLORS[c]; });
  Object.values(state.cityLayers).forEach(l => { l.setStyle(overviewStyle(l)); l._label.addTo(map); });
  state.browardBounds = layer.getBounds();
  fitBroward();
  layoutCityLabels();
  if (document.fonts) document.fonts.ready.then(layoutCityLabels);   // re-measure once Oswald has loaded

  // City dropdown
  const sel = $('citySelect');
  Object.keys(state.cityLayers).sort().forEach(k => {
    if (NOT_A_CITY.includes(k)) return;
    const o = document.createElement('option');
    o.value = k; o.textContent = titleCase(k) + (CITIES[k] && CITIES[k].file ? '' : ' (info only)');
    sel.appendChild(o);
  });

  // Deep link: #city=fort-lauderdale
  const m = location.hash.match(/city=([a-z-]+)/);
  if (m) { const k = Object.keys(state.cityLayers).find(k => slug(k) === m[1]); if (k) openCity(k); }
});

function labelEl(l) { const t = l._label && l._label.getTooltip(); return t && t.getElement(); }

// Decide which city names have room. Bigger cities claim space first. A name hides if it
// would spill far outside its own city or bump into a name already placed. Zooming in
// spreads cities apart, so hidden names come back by themselves. Hovering always shows a name.
function layoutCityLabels() {
  const placed = [];
  Object.values(state.cityLayers).sort((a, b) => b._area - a._area).forEach(l => {
    const el = labelEl(l); if (!el) return;
    let show = !NOT_A_CITY.includes(l._key) && l._key !== state.city;
    if (show) {
      const hovered = el.classList.contains('is-hover');
      if (hovered) el.classList.remove('is-hover');          // measure at normal size
      const r = el.getBoundingClientRect();
      if (hovered) el.classList.add('is-hover');
      const b = l.getBounds(), p1 = map.latLngToContainerPoint(b.getNorthWest()), p2 = map.latLngToContainerPoint(b.getSouthEast());
      const fits = r.width <= (p2.x - p1.x) * 1.3 + 12 && r.height <= (p2.y - p1.y) * 1.6 + 6;
      show = fits && !placed.some(q => overlaps(r, q));
      if (show) placed.push(r);
    }
    el.classList.toggle('is-crowded', !show);
  });
}

function hoverCity(l, on) {
  const el = labelEl(l);
  const showName = v => { if (el) { el.classList.toggle('is-hover', v); el.style.zIndex = v ? 1000 : ''; } };
  if (state.city) {                         // in city view: neighbors stay dull, but still clickable
    if (l._key === state.city) return;
    l.setStyle(on ? { fillOpacity: 0.45, fillColor: '#94a3b8' } : DULL);
    showName(on);
    return;
  }
  l.setStyle(on ? { fillColor: shade(l._color, -0.3), fillOpacity: 0.85, weight: 2.5 } : overviewStyle(l));
  if (on) l.bringToFront();
  showName(on);
  if (!state.away) $('hint').textContent = on ? `Tap to open ${titleCase(l._key)}` : 'Tap a city to zoom in';
}

// ---------- 8. City view ----------
function loadZones(key) {
  const cfg = CITIES[key] || {};
  if (!cfg.file) return Promise.resolve(null);
  return state.zoneCache[key] || (state.zoneCache[key] = fetch(cfg.file).then(r => r.json()).then(d => {
    d.features = d.features.filter(f => f.geometry);
    return d;
  }));
}

async function openCity(key) {
  closePanel();
  if (state.zonesLayer) { map.removeLayer(state.zonesLayer); state.zonesLayer = null; }
  removeZoneLabels();
  placeNames.addTo(map);
  state.city = key;
  const cfg = CITIES[key] || {};
  const cityLayer = state.cityLayers[key];

  // Dull every other city; outline the chosen one.
  Object.values(state.cityLayers).forEach(l => {
    const el = labelEl(l);
    if (el) { el.classList.remove('is-hover'); el.style.zIndex = ''; el.classList.toggle('is-dim', l !== cityLayer); }
    if (l === cityLayer) l.setStyle({ fillColor: l._color, fillOpacity: cfg.file ? 0.08 : 0.5, color: '#0f172a', weight: 3 });
    else l.setStyle(DULL);
  });
  cityLayer.bringToFront();
  map.fitBounds(cityLayer.getBounds(), { padding: [20, 20] });
  layoutCityLabels();                        // hides the open city's own name (the header shows it)

  setAway(true);
  $('citySelect').value = key;
  $('subtitle').textContent = titleCase(key);
  $('hint').hidden = true;
  history.replaceState(null, '', '#city=' + slug(key));

  if (!cfg.file) { showCityInfo(key, cfg); hideLegend(); return; }

  const data = await loadZones(key);
  if (state.city !== key) return;            // user moved on while loading

  state.zoneItems = [];
  state.zonesLayer = L.geoJSON(data, {
    onEachFeature: (f, l) => {
      state.zoneItems.push({ f, l });
      l.on('mouseover', () => { if (state.activeZone !== l) l.setStyle({ fillColor: shade(l._color, -0.3), fillOpacity: 0.88, weight: 2.5 }); });
      l.on('mouseout', () => { if (state.activeZone !== l) l.setStyle(zoneStyle(l)); });
      l.on('click', e => { L.DomEvent.stopPropagation(e); selectZone(f, l, e.latlng); });
      const nx = upcomingDates(f.properties, 1)[0];
      l.bindTooltip(`<b>${f.properties.name || 'Zone'}</b><div class="s">${f.properties.schedule || ''}</div>
        <div class="n">${nx ? 'Next pickup: ' + fmtShort(nx) : 'Date not published yet'}</div>
        <div class="h">Tap for calendar & directions</div>`,
        { sticky: true, direction: 'top', offset: [0, -8], opacity: 1, className: 'zone-tip' });
    }
  });
  // Rainbow along the city's longer side; neighbors never match or sit next to each other on the rainbow.
  rainbowColors(data.features, 'auto').idx.forEach((c, i) => { state.zoneItems[i].l._color = COLORS[c]; });
  state.zoneItems.forEach(z => z.l.setStyle(zoneStyle(z.l)));
  state.zonesLayer.addTo(map);
  addZoneLabels();
  buildLegend();
}

// Date label sitting on each zone (e.g. "Nov 2"), placed inside the zone's biggest piece.
function addZoneLabels() {
  removeZoneLabels();
  state.zoneLabels = state.zoneItems.map(({ f, l }) => {
    const nx = upcomingDates(f.properties, 1)[0];
    const text = nx ? nx.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : (f.properties.zone_id || '');
    const m = L.marker(labelPoint(f.geometry), { interactive: false, keyboard: false, icon: L.divIcon({ className: '', iconSize: [0, 0] }) })
      .bindTooltip(text, { permanent: true, direction: 'center', opacity: 1, className: 'zone-label' }).addTo(map);
    m._zone = l;
    m._area = geoArea(f.geometry);
    return m;
  });
  fitLabels();
}
function removeZoneLabels() { (state.zoneLabels || []).forEach(m => map.removeLayer(m)); state.zoneLabels = []; }
// Hide a zone's date chip if the zone is too small to hold it, or it would bump into a bigger zone's chip.
function fitLabels() {
  const placed = [];
  [...(state.zoneLabels || [])].sort((a, b) => b._area - a._area).forEach(m => {
    const el = m.getTooltip() && m.getTooltip().getElement(); if (!el) return;
    const b = m._zone.getBounds(), a = map.latLngToContainerPoint(b.getNorthWest()), c = map.latLngToContainerPoint(b.getSouthEast());
    const r = el.getBoundingClientRect();
    const show = Math.abs(c.x - a.x) >= 46 && Math.abs(c.y - a.y) >= 20 && !placed.some(q => overlaps(r, q, 2));
    if (show) placed.push(r);
    el.classList.toggle('is-hidden', !show);
  });
}
map.on('zoomend', () => { fitLabels(); layoutCityLabels(); });

// The spot deepest inside a shape (farthest from every edge), so a label sits well within its
// own color, even for odd shapes like Fort Lauderdale or Davie. Coarse grid first, then zoom in on the best spot.
function labelPoint(g) {
  const poly = rings(g).reduce((a, b) => ringArea(b[0]) > ringArea(a[0]) ? b : a);
  const xs = poly[0].map(p => p[0]), ys = poly[0].map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const k = Math.cos((y0 + y1) / 2 * Math.PI / 180);       // degrees of longitude are shorter than latitude here
  const shape = { type: 'Polygon', coordinates: poly };
  const depth = (x, y) => {
    if (!pointInGeom([x, y], shape)) return -1;
    let d = Infinity;
    for (const r of poly) for (let i = 1; i < r.length; i++) {
      const ax = r[i - 1][0] * k, ay = r[i - 1][1], dx = r[i][0] * k - ax, dy = r[i][1] - ay, px = x * k, L2 = dx * dx + dy * dy;
      const t = L2 ? Math.max(0, Math.min(1, ((px - ax) * dx + (y - ay) * dy) / L2)) : 0;
      const ex = ax + t * dx - px, ey = ay + t * dy - y, e = ex * ex + ey * ey;
      if (e < d) d = e;
    }
    return d;
  };
  let best = [(x0 + x1) / 2, (y0 + y1) / 2], bestD = -1, sx = (x1 - x0) / 16, sy = (y1 - y0) / 16;
  for (let i = 0; i <= 16; i++) for (let j = 0; j <= 16; j++) {
    const x = x0 + sx * i, y = y0 + sy * j, d = depth(x, y);
    if (d > bestD) { bestD = d; best = [x, y]; }
  }
  for (let round = 0; round < 4; round++) {
    sx /= 2; sy /= 2; const [cx, cy] = best;
    for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) {
      const x = cx + sx * i, y = cy + sy * j, d = depth(x, y);
      if (d > bestD) { bestD = d; best = [x, y]; }
    }
  }
  return [best[1], best[0]];
}

function zoneStyle(l) { return { fillColor: l._color, fillOpacity: 0.65, color: '#ffffff', weight: 1.2 }; }

// Back to the home screen from anywhere.
function goHome() {
  closePanel(); hideLegend();
  if (state.zonesLayer) { map.removeLayer(state.zonesLayer); state.zonesLayer = null; }
  state.city = null; state.activeZone = null; state.zoneItems = [];
  removeZoneLabels();
  map.removeLayer(placeNames);
  Object.values(state.cityLayers).forEach(l => {
    l.setStyle(overviewStyle(l));
    const el = labelEl(l);
    if (el) { el.classList.remove('is-dim', 'is-hover'); el.style.zIndex = ''; }
  });
  fitBroward();
  layoutCityLabels();
  setAway(false);
  $('citySelect').value = '';
  $('subtitle').textContent = 'Tap a city to see its bulk pickup zones';
  $('hint').hidden = false; $('hint').textContent = 'Tap a city to zoom in';
  history.replaceState(null, '', location.pathname);
}

// ---------- 9. Legend ----------
function buildLegend() {
  const list = $('legendList'); list.innerHTML = '';
  const items = [...state.zoneItems].sort((a, b) =>
    (a.f.properties.name || '').localeCompare(b.f.properties.name || '', undefined, { numeric: true }));
  items.forEach(({ f, l }) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="swatch" style="background:${l._color}"></span>
      <span>${f.properties.name || 'Zone'}<small>${f.properties.schedule || ''}</small></span>`;
    li.onclick = () => selectZone(f, l, l.getBounds().getCenter());
    li.onmouseenter = () => l.fire('mouseover');
    li.onmouseleave = () => l.fire('mouseout');
    l._legendItem = li;
    list.appendChild(li);
  });
  $('legendCount').textContent = `${items.length} zone${items.length === 1 ? '' : 's'}`;
  $('legend').hidden = false;
  $('legend').classList.toggle('collapsed', window.innerWidth <= 700);
}
function hideLegend() { $('legend').hidden = true; }
$('legendHead').onclick = () => $('legend').classList.toggle('collapsed');

// ---------- 10. Zone details panel ----------
const HOME_BTN = `<button class="btn" data-home type="button">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9v11h14V9"/><path d="M10 20v-6h4v6"/></svg>
  Back to all of Broward</button>`;

// The "next pickup" block + calendar buttons, shared by the zone panel and the "Find me" card.
function nextPickupHTML(p, color, city, zone, dirLL) {
  const dates = upcomingDates(p, 12), next = dates[0];
  if (!next) return `<div class="note">${p.bulk_day && p.bulk_day.startsWith('See') ? 'Apartments, condos and private-service properties: ask your property management for bulk days.' : 'Upcoming dates for this zone aren’t published yet.'}</div>`;
  return `<div class="next-card" style="background:${color};color:${textOn(color)}">
      <div class="label">Next bulk pickup</div>
      <div class="date">${fmtLong(next)}</div>
      <div class="when">${daysAway(next)} · put items out the night before</div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" data-ics type="button">＋ Add all ${dates.length} dates to my calendar</button>
      <div class="btn-row">
        <a class="btn" target="_blank" rel="noopener" href="${googleCalLink(city, zone, next, p.schedule || '')}">Google Calendar</a>
        ${dirLL ? `<a class="btn" target="_blank" rel="noopener" href="${directionsLink(dirLL)}">Directions</a>` : ''}
      </div>
    </div>
    <div class="upcoming"><h3>Coming up</h3><ul>${dates.slice(1, 7).map(d => `<li>${fmtShort(d)}</li>`).join('')}</ul></div>`;
}

function selectZone(f, l, latlng) {
  if (state.activeZone && state.activeZone !== l) state.activeZone.setStyle(zoneStyle(state.activeZone));
  state.zoneItems.forEach(z => z.l._legendItem && z.l._legendItem.classList.toggle('active', z.l === l));
  state.activeZone = l;
  l.setStyle({ fillColor: shade(l._color, -0.3), fillOpacity: 0.88, weight: 3, color: '#0f172a' });
  l.bringToFront();

  const p = f.properties;
  const city = titleCase(state.city);
  const zone = p.name || 'Zone';
  const cfg = CITIES[state.city] || {};
  const youHere = state.you && state.you.zone === f;

  let html = `<div class="eyebrow">${city}</div>
    <div class="zone-title"><span class="swatch" style="background:${l._color}"></span>${zone}</div>
    ${youHere ? '<div class="you-chip">You are here</div>' : ''}
    <p class="schedule">${p.schedule || ''}${p.garbage_days ? ` · Garbage ${p.garbage_days}` : ''}</p>`;
  html += nextPickupHTML(p, l._color, city, zone, youHere ? null : latlng);
  if (cfg.note) html += `<div class="note">${cfg.note}</div>`;
  if (p.note) html += `<p class="fineprint">${p.note}</p>`;
  if (p.neighborhoods) html += `<p class="fineprint"><strong>Neighborhoods:</strong> ${p.neighborhoods.slice(0, 12).join(', ')}${p.neighborhoods.length > 12 ? ` +${p.neighborhoods.length - 12} more` : ''}</p>`;
  html += `<p class="fineprint" style="margin:8px 0 12px">Holidays can move a pickup. Source: ${p.source || 'city GIS'}.</p>`;
  html += `<div class="actions">${HOME_BTN}</div>`;

  openPanel(html, { ics: () => downloadICS(city, zone, upcomingDates(p, 12), p.schedule || '') });
  showBesidePanel(youHere ? l.getBounds().extend(state.you.ll) : l.getBounds());
}

function showCityInfo(key, cfg) {
  const city = titleCase(key);
  let html = `<div class="eyebrow">Broward County</div>
    <div class="zone-title">${city}</div>
    <div class="note">${cfg.info || `${city} isn’t on the map yet.`}</div>`;
  if (cfg.link) html += `<div class="actions"><a class="btn btn-primary" target="_blank" rel="noopener" href="${cfg.link.url}">${cfg.link.label}</a></div>`;
  html += `<div class="actions"><a class="btn" target="_blank" rel="noopener" href="${directionsLink(state.cityLayers[key].getBounds().getCenter())}">Directions to ${city}</a>${HOME_BTN}</div>`;
  openPanel(html);
}

// Panel buttons are wired here so every card gets the same Home + calendar behavior.
function openPanel(html, handlers = {}) {
  $('panelBody').innerHTML = html; $('panel').hidden = false; $('panel').scrollTop = 0;
  document.body.classList.add('panel-open');
  $('panelBody').querySelectorAll('[data-home]').forEach(b => b.onclick = goHome);
  $('panelBody').querySelectorAll('[data-ics]').forEach(b => b.onclick = handlers.ics);
  $('panelBody').querySelectorAll('[data-zoom-you]').forEach(b => b.onclick = handlers.zoomYou);
}
// Fit something into the part of the map the panel isn't covering.
function panelPad() {
  const mobile = window.innerWidth <= 700;
  return mobile ? { paddingTopLeft: [20, 20], paddingBottomRight: [20, $('panel').offsetHeight + 20] }
                : { paddingTopLeft: [20, 20], paddingBottomRight: [$('panel').offsetWidth + 40, 20] };
}
function showBesidePanel(bounds) { map.fitBounds(bounds, { ...panelPad(), maxZoom: 16 }); }
function closePanel() {
  $('panel').hidden = true;
  document.body.classList.remove('panel-open');
  if (state.activeZone) { state.activeZone.setStyle(zoneStyle(state.activeZone)); state.activeZone = null; }
  state.zoneItems.forEach(z => z.l._legendItem && z.l._legendItem.classList.remove('active'));
}

// ---------- 11. Find me (your location) ----------
// The browser asks permission, gives us a lat/lng, and we test which city
// outline and which zone shape the point falls inside.
function locateMe() {
  const btn = $('locateBtn');
  if (!navigator.geolocation) return showLocateError('This browser can’t share your location. Pick your city from the list instead.');
  btn.classList.add('is-busy');
  navigator.geolocation.getCurrentPosition(
    pos => { btn.classList.remove('is-busy'); handleLocation(L.latLng(pos.coords.latitude, pos.coords.longitude), pos.coords.accuracy); },
    err => {
      btn.classList.remove('is-busy');
      showLocateError(err.code === 1
        ? 'Location is turned off for this site. Allow location in your browser settings, or pick your city from the list.'
        : 'We couldn’t get your location just now. Try again, or pick your city from the list.');
    },
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
}

function drawYou(ll, accuracy) {
  if (state.youLayer) map.removeLayer(state.youLayer);
  state.youLayer = L.layerGroup([
    L.circle(ll, { radius: Math.min(accuracy || 0, 800), pane: 'you', interactive: false, color: '#0A84FF', weight: 1, fillColor: '#0A84FF', fillOpacity: 0.1 }),
    L.marker(ll, { pane: 'you', interactive: false, keyboard: false, icon: L.divIcon({ className: '', html: '<div class="you-dot"><i></i></div>', iconSize: [20, 20], iconAnchor: [10, 10] }) })
  ]).addTo(map);
}

async function handleLocation(ll, accuracy) {
  drawYou(ll, accuracy);
  const pt = [ll.lng, ll.lat];
  const key = Object.keys(state.cityFeatures).find(k => pointInGeom(pt, state.cityFeatures[k].geometry));
  let zone = null;
  if (key && CITIES[key] && CITIES[key].file) {
    const data = await loadZones(key);
    zone = data.features.find(f => pointInGeom(pt, f.geometry)) || null;
  }
  state.you = { ll, accuracy, key, zone };
  showYouCard();
}

function showYouCard() {
  const { ll, accuracy, key, zone } = state.you;
  const cfg = CITIES[key] || {};
  const approx = accuracy > 300 ? `<p class="fineprint" style="margin-bottom:10px">Your location is approximate (within about ${Math.round(accuracy * 3.281 / 100) * 100} ft), so double-check if you live near a zone line.</p>` : '';
  let html;

  if (!key) {
    html = `<div class="eyebrow">Your location</div><div class="zone-title">Outside Broward County</div>
      <div class="note">This map covers Broward County only. Pick a city from the list to look one up.</div>`;
  } else if (NOT_A_CITY.includes(key)) {
    html = `<div class="eyebrow">Your location</div><div class="zone-title">Unincorporated Broward</div>
      <div class="note">You’re outside city limits. Bulk pickup here is handled by Broward County, not a city.</div>`;
  } else {
    const city = titleCase(key);
    const color = state.cityLayers[key]._color;
    html = `<div class="eyebrow">You are in</div>
      <div class="zone-title"><span class="swatch" style="background:${color}"></span>${city}</div>`;
    if (zone) {
      const p = zone.properties;
      html += `<div class="you-chip">${p.name || 'Your zone'}</div>
        <p class="schedule">${p.schedule || ''}${p.garbage_days ? ` · Garbage ${p.garbage_days}` : ''}</p>`
        + approx + nextPickupHTML(p, color, city, p.name || 'Zone', null)
        + `<div class="actions"><button class="btn btn-you" data-zoom-you type="button">
             <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5M11 8v6M8 11h6"/></svg>
             Show me on the ${city} zone map</button></div>`;
      if (cfg.note) html += `<div class="note">${cfg.note}</div>`;
    } else if (cfg.file) {
      html += approx + `<div class="note">Your spot isn’t inside one of ${city}’s mapped zones (it may be an apartment, condo or private-service area). Open the city map to check nearby zones.</div>
        <div class="actions"><button class="btn btn-you" data-zoom-you type="button">Open the ${city} zone map</button></div>`;
    } else {
      html += `<div class="note">${cfg.info || `${city} doesn’t publish a bulk zone map yet.`}</div>`;
      if (cfg.link) html += `<div class="actions"><a class="btn btn-primary" target="_blank" rel="noopener" href="${cfg.link.url}">${cfg.link.label}</a></div>`;
    }
  }
  html += `<div class="actions">${HOME_BTN}</div>`;

  // Center the map on you (in the part of the screen the card isn't covering).
  if (state.city && state.city !== key) goHome();
  setAway(true);
  $('hint').hidden = true;
  openPanel(html, {
    zoomYou: zoomToYou,
    ics: zone ? () => downloadICS(titleCase(key), zone.properties.name || 'Zone', upcomingDates(zone.properties, 12), zone.properties.schedule || '') : null
  });
  const d = 0.012;   // ~1 km around you
  showBesidePanel(L.latLngBounds([ll.lat - d, ll.lng - d], [ll.lat + d, ll.lng + d]));
}

async function zoomToYou() {
  const { key, zone, ll } = state.you;
  await openCity(key);
  const item = zone && state.zoneItems.find(z => z.f.properties.name === zone.properties.name && z.f.properties.zone_id === zone.properties.zone_id);
  if (item) { state.you.zone = item.f; selectZone(item.f, item.l, ll); }
  else map.fitBounds(state.cityLayers[key].getBounds().extend(ll), { padding: [20, 20] });
}

function showLocateError(msg) {
  setAway(true);
  openPanel(`<div class="eyebrow">Your location</div><div class="zone-title">Location not available</div>
    <div class="note">${msg}</div><div class="actions">${HOME_BTN}</div>`);
}

// ---------- 12. Controls ----------
$('panelClose').onclick = () => { closePanel(); if (!state.city) setAway(!!state.you); };
$('homeBtn').onclick = goHome;
$('citySelect').onchange = e => e.target.value ? openCity(e.target.value) : goHome();
map.on('click', () => { if (state.activeZone) closePanel(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('panel').hidden) closePanel(); else if (state.away) goHome(); } });
</script>
</body>
</html>
