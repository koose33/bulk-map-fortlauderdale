<style>

```
<div id="controls">
    <label for="citySelect">Select City:</label>
    <select id="citySelect">
        <option value="all">All Cities</option>
        <option value="fortlauderdale">Fort Lauderdale</option>
        <option value="wiltonmanors">Wilton Manors</option>
        <option value="oaklandpark">Oakland Park</option>
        <option value="pompanobeach">Pompano Beach</option>
    </select>
</div>

<div id="map"></div>

<div class="legend">
    <button class="legend-toggle" onclick="toggleLegend()">
        <span id="legendIcon">📋</span>
        <span>Legend</span>
    </button>
    <div class="legend-content" id="legendContent"></div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Initialize map with CartoDB Light basemap
    const map = L.map('map').setView([26.1224, -80.1373], 11);
    
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 20
    }).addTo(map);

    let allLayers = {};
    let currentZoomLevel = 'overview'; // 'overview' or 'city'
    let currentCity = null;

    // City-level colors (when zoomed out)
    const cityOverviewColors = {
        'fortlauderdale': '#ef4444',
        'wiltonmanors': '#3b82f6',
        'oaklandpark': '#10b981',
        'pompanobeach': '#f59e0b'
    };

    // Fort Lauderdale zone colors (when zoomed in)
    const ftlZoneColors = {
        'Monday Week 1': '#ef4444',
        'Monday Week 2': '#f97316', 
        'Monday Week 3': '#f59e0b',
        'Monday Week 4': '#84cc16',
        'Tuesday Week 1': '#22c55e',
        'Tuesday Week 2': '#10b981',
        'Tuesday Week 3': '#14b8a6',
        'Tuesday Week 4': '#06b6d4',
        'Wednesday Week 1': '#0ea5e9',
        'Wednesday Week 2': '#3b82f6',
        'Wednesday Week 3': '#6366f1',
        'Wednesday Week 4': '#8b5cf6',
        'Thursday Week 1': '#a855f7',
        'Thursday Week 2': '#d946ef',
        'Thursday Week 3': '#ec4899',
        'Thursday Week 4': '#f43f5e',
        'Friday Week 1': '#be123c',
        'Friday Week 2': '#9f1239',
        'Friday Week 3': '#881337',
        'Friday Week 4': '#4c1d95'
    };

    // Other city zone colors (when zoomed in)
    const wiltonManorsZoneColors = {'Zone 1': '#3b82f6', 'Zone 2': '#8b5cf6'};
    const oaklandParkZoneColors = {'NW': '#ef4444', 'NE': '#3b82f6', 'SW': '#10b981', 'SE': '#f59e0b'};
    const pompanoBeachZoneColors = {'West': '#ef4444', 'Central': '#3b82f6', 'East': '#10b981'};

    const cityZoneColors = {
        'fortlauderdale': ftlZoneColors,
        'wiltonmanors': wiltonManorsZoneColors,
        'oaklandpark': oaklandParkZoneColors,
        'pompanobeach': pompanoBeachZoneColors
    };

    const citySchedules = {
        'fortlauderdale': ftlZoneColors, // Keys are the schedules
        'wiltonmanors': {'Zone 1': 'Weekly Monday', 'Zone 2': 'Weekly Monday'},
        'oaklandpark': {'NW': 'Monthly 1st Monday', 'NE': 'Monthly 2nd Monday', 'SW': 'Monthly 3rd Monday', 'SE': 'Monthly 4th Monday'},
        'pompanobeach': {'West': 'Weekly Monday', 'Central': 'Weekly Tuesday', 'East': 'Weekly Wednesday'}
    };

    function getNextPickupDate(dayOfWeek, weekNumber) {
        const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const today = new Date();
        const currentDay = today.getDay();
        const targetDay = days.indexOf(dayOfWeek);
        
        let daysUntilTarget = targetDay - currentDay;
        if (daysUntilTarget < 0) daysUntilTarget += 7;
        
        const nextDate = new Date(today);
        nextDate.setDate(today.getDate() + daysUntilTarget);
        
        const weekOfMonth = Math.ceil(nextDate.getDate() / 7);
        if (weekNumber && weekOfMonth !== weekNumber) {
            nextDate.setDate(nextDate.getDate() + 7);
        }
        
        return nextDate.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }

    function generateICS(title, date) {
        const event = [
            'BEGIN:VCALENDAR',
            'VERSION:2.0',
            'BEGIN:VEVENT',
            'DTSTART:' + date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z',
            'SUMMARY:' + title,
            'DESCRIPTION:Bulk trash pickup day',
            'END:VEVENT',
            'END:VCALENDAR'
        ].join('\n');
        
        const blob = new Blob([event], { type: 'text/calendar' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'bulk-pickup.ics';
        a.click();
    }

    function getColorForFeature(cityKey, zoneName) {
        if (currentZoomLevel === 'overview') {
            return cityOverviewColors[cityKey] || '#94a3b8';
        } else if (currentZoomLevel === 'city' && currentCity === cityKey) {
            return cityZoneColors[cityKey][zoneName] || '#94a3b8';
        } else {
            return cityOverviewColors[cityKey] || '#94a3b8';
        }
    }

    function loadCity(cityKey, geoJsonFile) {
        fetch(geoJsonFile)
            .then(response => response.json())
            .then(data => {
                const layer = L.geoJSON(data, {
                    style: function(feature) {
                        const zoneName = feature.properties.name || feature.properties.ZONE || feature.properties.NAME || 'Unknown';
                        return {
                            fillColor: getColorForFeature(cityKey, zoneName),
                            weight: 2,
                            opacity: 1,
                            color: 'white',
                            fillOpacity: 0.6
                        };
                    },
                    onEachFeature: function(feature, layer) {
                        const zoneName = feature.properties.name || feature.properties.ZONE || feature.properties.NAME || 'Unknown';
                        const scheduleInfo = citySchedules[cityKey];
                        const schedule = scheduleInfo[zoneName] || zoneName;
                        
                        let nextPickup = '';
                        if (schedule.includes('Monday')) nextPickup = getNextPickupDate('Monday');
                        else if (schedule.includes('Tuesday')) nextPickup = getNextPickupDate('Tuesday');
                        else if (schedule.includes('Wednesday')) nextPickup = getNextPickupDate('Wednesday');
                        else if (schedule.includes('Thursday')) nextPickup = getNextPickupDate('Thursday');
                        else if (schedule.includes('Friday')) nextPickup = getNextPickupDate('Friday');
                        
                        layer.on('click', function(e) {
                            // Zoom into this city if not already zoomed
                            if (currentZoomLevel === 'overview') {
                                zoomToCity(cityKey);
                            }
                            
                            // Show popup
                            const popupContent = `
                                <div class="popup-content">
                                    <h3>${zoneName}</h3>
                                    <p><strong>Schedule:</strong> ${schedule}</p>
                                    ${nextPickup ? `<p><strong>Next Pickup:</strong> ${nextPickup}</p>` : ''}
                                    <div class="popup-buttons">
                                        <button class="popup-btn calendar-btn" onclick="addToCalendar('${zoneName}', '${nextPickup}')">📅 Add to Calendar</button>
                                        <button class="popup-btn directions-btn" onclick="getDirections(${e.latlng.lat}, ${e.latlng.lng})">🗺️ Directions</button>
                                    </div>
                                </div>
                            `;
                            
                            layer.bindPopup(popupContent).openPopup();
                        });
                    }
                }).addTo(map);
                
                allLayers[cityKey] = layer;
                updateLegend();
            })
            .catch(error => console.error(`Error loading ${cityKey}:`, error));
    }

    function zoomToCity(cityKey) {
        if (!allLayers[cityKey]) return;
        
        currentZoomLevel = 'city';
        currentCity = cityKey;
        
        // Recolor all layers
        Object.keys(allLayers).forEach(key => {
            allLayers[key].eachLayer(function(layer) {
                const zoneName = layer.feature.properties.name || layer.feature.properties.ZONE || layer.feature.properties.NAME || 'Unknown';
                layer.setStyle({
                    fillColor: getColorForFeature(key, zoneName),
                    fillOpacity: key === cityKey ? 0.6 : 0.2,
                    weight: 2,
                    color: 'white'
                });
            });
        });
        
        // Zoom to city bounds
        map.fitBounds(allLayers[cityKey].getBounds(), { padding: [50, 50] });
        updateLegend();
    }

    function resetToOverview() {
        currentZoomLevel = 'overview';
        currentCity = null;
        
        // Recolor all layers back to overview colors
        Object.keys(allLayers).forEach(key => {
            allLayers[key].eachLayer(function(layer) {
                const zoneName = layer.feature.properties.name || layer.feature.properties.ZONE || layer.feature.properties.NAME || 'Unknown';
                layer.setStyle({
                    fillColor: getColorForFeature(key, zoneName),
                    fillOpacity: 0.6,
                    weight: 2,
                    color: 'white'
                });
            });
        });
        
        map.setView([26.1224, -80.1373], 11);
        updateLegend();
    }

    function addToCalendar(zone, dateStr) {
        const date = new Date(dateStr);
        generateICS(`Bulk Pickup - ${zone}`, date);
    }

    function getDirections(lat, lng) {
        window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`, '_blank');
    }

    function toggleLegend() {
        const content = document.getElementById('legendContent');
        const icon = document.getElementById('legendIcon');
        content.classList.toggle('show');
        icon.textContent = content.classList.contains('show') ? '✖️' : '📋';
    }

    function updateLegend() {
        const legendContent = document.getElementById('legendContent');
        let html = '';
        
        if (currentZoomLevel === 'overview') {
            // Show city-level legend
            html += '<div class="legend-city"><div class="legend-city-name">Cities</div>';
            for (const [cityKey, color] of Object.entries(cityOverviewColors)) {
                const cityName = cityKey.replace(/([A-Z])/g, ' $1').trim().replace(/^./, str => str.toUpperCase());
                html += `<div class="legend-item">
                    <div class="legend-color" style="background-color: ${color}"></div>
                    <span>${cityName}</span>
                </div>`;
            }
            html += '</div>';
        } else if (currentCity) {
            // Show zone-level legend for current city
            const cityName = currentCity.replace(/([A-Z])/g, ' $1').trim().replace(/^./, str => str.toUpperCase());
            const zoneColors = cityZoneColors[currentCity];
            
            html += `<div class="legend-city"><div class="legend-city-name">${cityName} Zones</div>`;
            for (const [zone, color] of Object.entries(zoneColors)) {
                html += `<div class="legend-item">
                    <div class="legend-color" style="background-color: ${color}"></div>
                    <span>${zone}</span>
                </div>`;
            }
            html += '</div>';
        }
        
        legendContent.innerHTML = html;
    }

    // Load all cities with ORIGINAL working GeoJSON files
    loadCity('fortlauderdale', 'bulk-map-fortlauderdale.geojson');
    loadCity('wiltonmanors', 'wilton-manors-zones-2025.geojson');
    loadCity('oaklandpark', 'oakland-park-zones.geojson');
    loadCity('pompanobeach', 'pompano-beach-zones.geojson');

    // City filter
    document.getElementById('citySelect').addEventListener('change', function(e) {
        const selected = e.target.value;
        
        if (selected === 'all') {
            resetToOverview();
        } else {
            zoomToCity(selected);
        }
    });
</script>
