```

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Initialize map with CartoDB Light basemap
    const map = L.map('map').setView([26.1224, -80.1373], 11);
    
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 20
    }).addTo(map);

    let allLayers = {};
    let cityColors = {};

    // Fort Lauderdale - Rainbow colors
    const ftlColors = {
        'Monday Week 1': '#ef4444',
        'Monday Week 2': '#f97316', 
        'Monday Week 3': '#f59e0b',
        'Monday Week 4': '#84cc16',
        'Tuesday Week 1': '#22c55e',
        'Tuesday Week 2': '#10b981',
        'Tuesday Week 3': '#14b8a6',
        'Tuesday Week 4': '#06b6d4',
        'Wednesday Week 1': '#0ea5e9',
        'Wednesday Week 2': '#3b82f6',
        'Wednesday Week 3': '#6366f1',
        'Wednesday Week 4': '#8b5cf6',
        'Thursday Week 1': '#a855f7',
        'Thursday Week 2': '#d946ef',
        'Thursday Week 3': '#ec4899',
        'Thursday Week 4': '#f43f5e',
        'Friday Week 1': '#be123c',
        'Friday Week 2': '#9f1239',
        'Friday Week 3': '#881337',
        'Friday Week 4': '#4c1d95'
    };

    cityColors['fortlauderdale'] = ftlColors;
    cityColors['wiltonmanors'] = {'Zone 1': '#3b82f6', 'Zone 2': '#8b5cf6'};
    cityColors['oaklandpark'] = {'NW': '#ef4444', 'NE': '#3b82f6', 'SW': '#10b981', 'SE': '#f59e0b'};
    cityColors['pompanobeach'] = {'West': '#ef4444', 'Central': '#3b82f6', 'East': '#10b981'};
    cityColors['sunrise'] = {'Sunrise': '#f59e0b'};
    cityColors['davie'] = {'Davie': '#ec4899'};
    cityColors['hollywood'] = {'Hollywood': '#8b5cf6'};
    cityColors['pembrokepines'] = {'Pembroke Pines': '#06b6d4'};
    cityColors['coralsprings'] = {'Coral Springs': '#10b981'};
    cityColors['plantation'] = {'Plantation': '#f97316'};
    cityColors['miramar'] = {'Miramar': '#6366f1'};
    cityColors['weston'] = {'Weston': '#a855f7'};
    cityColors['parkland'] = {'Parkland': '#22c55e'};
    cityColors['margate'] = {'Margate': '#0ea5e9'};
    cityColors['coconutcreek'] = {'Coconut Creek': '#84cc16'};
    cityColors['deerfieldbeach'] = {'Deerfield Beach': '#d946ef'};
    cityColors['tamarac'] = {'Tamarac': '#f43f5e'};
    cityColors['lauderhill'] = {'Lauderhill': '#14b8a6'};
    cityColors['northlauderdale'] = {'North Lauderdale': '#be123c'};
    cityColors['lauderdalelakes'] = {'Lauderdale Lakes': '#9f1239'};

    function getNextPickupDate(dayOfWeek, weekNumber) {
        const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const today = new Date();
        const currentDay = today.getDay();
        const targetDay = days.indexOf(dayOfWeek);
        
        let daysUntilTarget = targetDay - currentDay;
        if (daysUntilTarget < 0) daysUntilTarget += 7;
        
        const nextDate = new Date(today);
        nextDate.setDate(today.getDate() + daysUntilTarget);
        
        const weekOfMonth = Math.ceil(nextDate.getDate() / 7);
        if (weekNumber && weekOfMonth !== weekNumber) {
            nextDate.setDate(nextDate.getDate() + 7);
        }
        
        return nextDate.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }

    function generateICS(title, date) {
        const event = [
            'BEGIN:VCALENDAR',
            'VERSION:2.0',
            'BEGIN:VEVENT',
            'DTSTART:' + date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z',
            'SUMMARY:' + title,
            'DESCRIPTION:Bulk trash pickup day',
            'END:VEVENT',
            'END:VCALENDAR'
        ].join('\n');
        
        const blob = new Blob([event], { type: 'text/calendar' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'bulk-pickup.ics';
        a.click();
    }

    function loadCity(cityKey, geoJsonFile, scheduleInfo) {
        fetch(geoJsonFile)
            .then(response => response.json())
            .then(data => {
                const colors = cityColors[cityKey] || {};
                
                const layer = L.geoJSON(data, {
                    style: function(feature) {
                        const zoneName = feature.properties.name || feature.properties.ZONE || feature.properties.NAME || 'Unknown';
                        return {
                            fillColor: colors[zoneName] || '#94a3b8',
                            weight: 2,
                            opacity: 1,
                            color: 'white',
                            fillOpacity: 0.6
                        };
                    },
                    onEachFeature: function(feature, layer) {
                        const zoneName = feature.properties.name || feature.properties.ZONE || feature.properties.NAME || 'Unknown';
                        const schedule = scheduleInfo[zoneName] || 'Schedule info not available';
                        
                        let nextPickup = '';
                        if (schedule.includes('Monday')) nextPickup = getNextPickupDate('Monday');
                        else if (schedule.includes('Tuesday')) nextPickup = getNextPickupDate('Tuesday');
                        else if (schedule.includes('Wednesday')) nextPickup = getNextPickupDate('Wednesday');
                        else if (schedule.includes('Thursday')) nextPickup = getNextPickupDate('Thursday');
                        else if (schedule.includes('Friday')) nextPickup = getNextPickupDate('Friday');
                        
                        const popupContent = `
                            <div class="popup-content">
                                <h3>${zoneName}</h3>
                                <p><strong>Schedule:</strong> ${schedule}</p>
                                ${nextPickup ? `<p><strong>Next Pickup:</strong> ${nextPickup}</p>` : ''}
                                <div class="popup-buttons">
                                    <button class="popup-btn calendar-btn" onclick="addToCalendar('${zoneName}', '${nextPickup}')">📅 Add to Calendar</button>
                                    <button class="popup-btn directions-btn" onclick="getDirections(${layer.getBounds().getCenter().lat}, ${layer.getBounds().getCenter().lng})">🗺️ Directions</button>
                                </div>
                            </div>
                        `;
                        
                        layer.bindPopup(popupContent);
                    }
                }).addTo(map);
                
                allLayers[cityKey] = layer;
                updateLegend();
            })
            .catch(error => console.error(`Error loading ${cityKey}:`, error));
    }

    function addToCalendar(zone, dateStr) {
        const date = new Date(dateStr);
        generateICS(`Bulk Pickup - ${zone}`, date);
    }

    function getDirections(lat, lng) {
        window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`, '_blank');
    }

    function toggleLegend() {
        const content = document.getElementById('legendContent');
        const icon = document.getElementById('legendIcon');
        content.classList.toggle('show');
        icon.textContent = content.classList.contains('show') ? '✖️' : '📋';
    }

    function updateLegend() {
        const legendContent = document.getElementById('legendContent');
        let html = '';
        
        for (const [cityKey, colors] of Object.entries(cityColors)) {
            if (allLayers[cityKey]) {
                const cityName = cityKey.replace(/([A-Z])/g, ' $1').trim().replace(/^./, str => str.toUpperCase());
                html += `<div class="legend-city">
                    <div class="legend-city-name">${cityName}</div>`;
                
                for (const [zone, color] of Object.entries(colors)) {
                    html += `<div class="legend-item">
                        <div class="legend-color" style="background-color: ${color}"></div>
                        <span>${zone}</span>
                    </div>`;
                }
                html += '</div>';
            }
        }
        
        legendContent.innerHTML = html;
    }

    // Load all cities
    loadCity('fortlauderdale', 'bulk-map-fortlauderdale.geojson', ftlColors);
    loadCity('wiltonmanors', 'wilton-manors-zones-2025.geojson', {'Zone 1': 'Weekly Monday', 'Zone 2': 'Weekly Monday'});
    loadCity('oaklandpark', 'oakland-park-zones.geojson', {'NW': 'Monthly 1st Monday', 'NE': 'Monthly 2nd Monday', 'SW': 'Monthly 3rd Monday', 'SE': 'Monthly 4th Monday'});
    loadCity('pompanobeach', 'pompano-beach-zones.geojson', {'West': 'Weekly Monday', 'Central': 'Weekly Tuesday', 'East': 'Weekly Wednesday'});
    loadCity('sunrise', 'sunrise-zones.geojson', {'Sunrise': 'Check city website'});
    loadCity('davie', 'davie-zones.geojson', {'Davie': 'Check city website'});
    loadCity('hollywood', 'hollywood-zones.geojson', {'Hollywood': 'Check city website'});
    loadCity('pembrokepines', 'pembroke-pines-zones.geojson', {'Pembroke Pines': 'Check city website'});
    loadCity('coralsprings', 'coral-springs-zones.geojson', {'Coral Springs': 'Check city website'});
    loadCity('plantation', 'plantation-zones.geojson', {'Plantation': 'Check city website'});
    loadCity('miramar', 'miramar-zones.geojson', {'Miramar': 'Check city website'});
    loadCity('weston', 'weston-zones.geojson', {'Weston': 'Check city website'});
    loadCity('parkland', 'parkland-zones.geojson', {'Parkland': 'Check city website'});
    loadCity('margate', 'margate-zones.geojson', {'Margate': 'Check city website'});
    loadCity('coconutcreek', 'coconut-creek-zones.geojson', {'Coconut Creek': 'Check city website'});
    loadCity('deerfieldbeach', 'deerfield-beach-zones.geojson', {'Deerfield Beach': 'Check city website'});
    loadCity('tamarac', 'tamarac-zones.geojson', {'Tamarac': 'Check city website'});
    loadCity('lauderhill', 'lauderhill-zones.geojson', {'Lauderhill': 'Check city website'});
    loadCity('northlauderdale', 'north-lauderdale-zones.geojson', {'North Lauderdale': 'Check city website'});
    loadCity('lauderdalelakes', 'lauderdale-lakes-zones.geojson', {'Lauderdale Lakes': 'Check city website'});

    // City filter
    document.getElementById('citySelect').addEventListener('change', function(e) {
        const selected = e.target.value;
        
        for (const [cityKey, layer] of Object.entries(allLayers)) {
            if (selected === 'all' || selected === cityKey) {
                map.addLayer(layer);
            } else {
                map.removeLayer(layer);
            }
        }
        
        if (selected !== 'all' && allLayers[selected]) {
            map.fitBounds(allLayers[selected].getBounds());
        } else {
            map.setView([26.1224, -80.1373], 11);
        }
    });
</script>
